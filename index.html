
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAPZ - Quem entrega, conecta!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(8px); }
        #root:not(:empty) { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Estilo para o aviso de servidor local */
        #local-server-warning {
            display: none;
            position: fixed;
            inset: 0;
            background: #f8fafc;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <!-- Aviso amigável para erro de CORS/file:// -->
    <div id="local-server-warning">
        <div style="background: white; padding: 2.5rem; border-radius: 2rem; shadow: 0 25px 50px -12px rgba(0,0,0,0.1); max-width: 500px; border: 1px solid #e2e8f0;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🚀</div>
            <h1 style="font-size: 1.5rem; font-weight: 800; color: #1e293b; margin-bottom: 1rem;">Quase lá!</h1>
            <p style="color: #64748b; line-height: 1.6; margin-bottom: 1.5rem;">
                O RAPZ utiliza módulos modernos que não funcionam quando abertos diretamente pelo arquivo (<code>file://</code>).
            </p>
            <div style="text-align: left; background: #f1f5f9; padding: 1.5rem; border-radius: 1rem; font-size: 0.875rem;">
                <p style="font-weight: 700; color: #475569; margin-bottom: 0.5rem;">Como visualizar:</p>
                <ul style="margin: 0; padding-left: 1.25rem; color: #64748b;">
                    <li>Use a extensão <strong>Live Server</strong> no VS Code.</li>
                    <li>Ou rode <code>npx serve .</code> na pasta do projeto.</li>
                    <li>Ou suba os arquivos para a <strong>Vercel/Netlify</strong>.</li>
                </ul>
            </div>
        </div>
    </div>

    <div id="root"></div>

    <script>
        // Detecta se o app está sendo aberto via protocolo de arquivo
        if (window.location.protocol === 'file:') {
            document.getElementById('local-server-warning').style.display = 'flex';
        }
    </script>
    
    <!-- O script principal só será carregado corretamente via http:// ou https:// -->
    <script type="module" src="./index.tsx"></script>
</body>
</html>
